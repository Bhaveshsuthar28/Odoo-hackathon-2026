services:
  # ============================================================================
  # PostgreSQL 16 Production Relational Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: subflow-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - subflow-prod-network

  # ============================================================================
  # Database Migration Runner (Ephemeral One-Shot Container)
  # ============================================================================
  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: subflow-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy", "--schema=packages/database/prisma/schema.prisma"]
    networks:
      - subflow-prod-network

  # ============================================================================
  # Fastify REST API Production Service
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: subflow-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      APP_URL: ${APP_URL}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - subflow-prod-network

  # ============================================================================
  # Autonomous Billing Worker Production Service
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    container_name: subflow-worker-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      BILLING_CRON_SCHEDULE: ${BILLING_CRON_SCHEDULE:-0 * * * *}
    networks:
      - subflow-prod-network

  # ============================================================================
  # Next.js 15 Production Web Application
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: subflow-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - subflow-prod-network

volumes:
  postgres_prod_data:
    name: subflow_postgres_prod_data

networks:
  subflow-prod-network:
    name: subflow_prod_network
    driver: bridge
