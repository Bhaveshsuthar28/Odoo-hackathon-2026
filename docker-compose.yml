version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: subflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subflow}
      POSTGRES_DB: ${POSTGRES_DB:-subflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subflow} -d ${POSTGRES_DB:-subflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
